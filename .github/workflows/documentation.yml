name: Documentation
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  build:
    name: Build & deploy docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write       # to push to gh-pages
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      # The unregistered siblings (MetricSpaces, TDAmapper and the independent
      # TDAPersistenceDiagrams fork) are developed with the package itself.
      # Drop the committed package Manifest.toml first: it pins the siblings
      # (including TDAPersistenceDiagrams) to local `../*.jl` checkouts that do not
      # exist in CI, and `develop`ing the package by path would otherwise inherit
      # those dead pins.
      - name: Develop unregistered ecosystem packages
        run: |
          rm -f Manifest.toml
          julia --project=docs -e '
            using Pkg
            Pkg.develop([
              PackageSpec(url = "https://github.com/JuliaTDA/MetricSpaces.jl"),
              PackageSpec(url = "https://github.com/JuliaTDA/TDAmapper.jl"),
              PackageSpec(url = "https://github.com/JuliaTDA/PersistenceDiagrams.jl"),
              PackageSpec(path = pwd()),
            ])
            Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}          # for gh-pages deploy
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}       # optional SSH deploy key
        run: julia --project=docs docs/make.jl
