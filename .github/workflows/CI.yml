name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Cancel in-progress runs of the same workflow on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'        # latest stable 1.x; the MetricSpaces dependency pins
                       # `Downloads = "1.7.0"`, unsatisfiable on 1.10.
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      # The committed Manifest.toml pins the sibling packages (MetricSpaces,
      # TDAmapper, PersistenceDiagrams) to local `../*.jl` checkouts that do not
      # exist in an isolated CI checkout, so drop it and resolve fresh: the
      # unregistered siblings are `develop`ed from their GitHub URLs and
      # PersistenceDiagrams resolves from the General registry. Developing ToMATo
      # (a test-only dep) also overrides the `[sources]` path in Project.toml.
      - name: Develop unregistered ecosystem packages
        run: |
          rm -f Manifest.toml
          julia --project=. -e '
            using Pkg
            Pkg.develop([
              PackageSpec(url = "https://github.com/JuliaTDA/MetricSpaces.jl"),
              PackageSpec(url = "https://github.com/JuliaTDA/TDAmapper.jl"),
              PackageSpec(url = "https://github.com/JuliaTDA/ToMATo.jl"),
            ])
            Pkg.instantiate()'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
